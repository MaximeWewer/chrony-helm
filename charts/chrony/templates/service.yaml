{{- if .Values.service.enabled -}}
{{- $svc := .Values.service -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chrony.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chrony.labels" . | nindent 4 }}
    {{- with $svc.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svc.type }}
  {{- with $svc.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  {{- with $svc.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with $svc.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if and $svc.externalTrafficPolicy (has $svc.type (list "NodePort" "LoadBalancer")) }}
  externalTrafficPolicy: {{ $svc.externalTrafficPolicy }}
  {{- end }}
  {{- with $svc.internalTrafficPolicy }}
  internalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with $svc.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  {{- if eq $svc.type "LoadBalancer" }}
  {{- with $svc.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with $svc.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with $svc.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    {{- include "chrony.selectorLabels" . | nindent 4 }}
  ports:
    - name: ntp
      port: {{ $svc.ntpPort }}
      targetPort: ntp
      protocol: UDP
      {{- if and $svc.nodePorts.ntp (has $svc.type (list "NodePort" "LoadBalancer")) }}
      nodePort: {{ $svc.nodePorts.ntp }}
      {{- end }}
    {{- if .Values.nts.server.enabled }}
    - name: nts-ke
      port: {{ $svc.ntsPort }}
      targetPort: nts-ke
      protocol: TCP
      {{- if and $svc.nodePorts.nts (has $svc.type (list "NodePort" "LoadBalancer")) }}
      nodePort: {{ $svc.nodePorts.nts }}
      {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.monitoring.enabled }}
---
# Metrics on their own ClusterIP Service: the client Service may be a
# LoadBalancer, and the exporter has no business on a public address.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chrony.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chrony.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    {{- include "chrony.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.monitoring.exporter.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
